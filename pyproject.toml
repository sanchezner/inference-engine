[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engine"
version = "0.1.0"
description = "A from-scratch LLM inference runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14",
    "transformers>=5.20",
    "triton>=3.8",
]

[tool.setuptools.packages.find]
include = ["engine*"]
